name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Unit tests
        run: uv run pytest tests/ -q

      # No Feldera instance in CI, so the end-to-end test skips itself.
      # The protocol scenarios run a real DuckLake extension in-process.
      - name: Protocol scenarios
        run: uv run fd-connectors validate-local